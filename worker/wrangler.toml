# RhinE-UI 的 Cloudflare Worker 配置
#
# 额度要点（官方文档 workers/static-assets/billing-and-limitations）：
#   "Requests to static assets are free and unlimited."
#   "When using run_worker_first, requests matching the specified patterns will always
#    invoke your Worker script. If you exceed your free tier request limits, these requests
#    will receive a 429 instead of falling back to static asset serving."
#   → 只有 /musiclab/*（内置 demo 音乐）走 Worker 脚本（为了补 Range），这部分**计入**每日
#     10 万次额度；其余全部请求仍由静态资源层直接返回 —— 依然**免费且不限量**。
#     不这样做的话音频"拖不动进度条"（Workers 静态资源不处理 Range，见 skill 的 H 节）。
#
# 静态文件来自 ../dist（由 node build-static.mjs 生成，含构建期清单、demo 曲库索引）。

name = "rhine-ui"
main = "src/worker.js"
compatibility_date = "2026-10-11"

[assets]
directory = "../dist"
binding = "ASSETS"
# 只让 demo 音乐进 Worker（自己实现 Range）；其余请求不调用脚本。
run_worker_first = ["/musiclab/*"]
# 404-page：不存在的路径返回静态 404，不调用 Worker 脚本 —— 扫描器刷 /\.env 之类路径零成本。
not_found_handling = "404-page"

# 自定义域名：部署时自动创建域名绑定 + DNS 记录 + 证书（Universal SSL 覆盖一级子域）。
# 想换名字改这一行即可，例如 rhine-ui.auak.dpdns.org。
[[routes]]
pattern = "rhine.auak.dpdns.org"
custom_domain = true
